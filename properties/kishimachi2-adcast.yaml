      同じ元付データから両方が出ているため、どちらか一方の誤りが2媒体に伝播している。
      査定は保守側(北東=-3%)で置いた。南西向きなら+2%で、適正中央値は約+2%動く"
    check: "現地の方位磁針で実測。2階LDKの窓が向く先(空か隣家か)を内見時に必ず見る"
  - title: "二方とも私道で公道に接していない。**私道負担35.26m2は宅地55.09m2の64%**にあたり、持分の記載がない"
    effect: "掲載条件のKO6(通行料)には該当しないが、台帳の suspect 条件(私道持分の不明記)に当たる"
    detail: "SUUMOの『私道負担・道路』欄は『35.26m2、北東4m幅(接道幅7.6m)、南東4m幅(接道幅4.5m)』。
      建ぺい率の検算(1階33.08/55.09=60.05%=指定60%ちょうど)から、55.09m2は建築基準法上の敷地で
      **私道35.26m2はこれとは別枠**とみられる。論点は通行料(記載なし)ではなく、
      ①持分の有無と割合 ②42条の区分(位置指定道路か2項道路か) ③掘削承諾の書面 ④建替時の承諾
      ⑤金融機関の私道承諾書 ⑥私道部分の固定資産税(非課税申請の要否) ⑦舗装補修の負担。
      **新築で建築確認が下りている事実は現時点の接道を保証するだけで、将来の建替え・融資・再販が
      第三者の承諾に依存する点は解消しない**。台帳ではこの情報はathomeの接道状況欄にしか出ないことが多い"
    check: "重説の前に①公図・地積測量図で私道の筆と持分 ②道路種別(役所の道路台帳)③掘削承諾書の有無 を書面で"
  - title: "崖線(名主の滝公園)の直下で、丁目内に土砂災害特別警戒区域(レッド)が実在する"
    effect: "掲載の『その他制限事項』は『-』(空欄)だが、この欄の空欄は非該当の証拠にならない"
    detail: "同じ岸町2丁目の中古掲載(nc_20425133)では同欄に『景観法による規制有、高度地区、準防火地域』が入る。
