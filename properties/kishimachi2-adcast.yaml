      台帳の他物件と**延床の数字をそのまま比べると本物件だけが11.7%かさ上げされる**ので、
      横並びは居住80.30m2で行うこと。
      **2026-08-29の敵対的レビューで訂正**: 当初「同価格帯(6,900〜8,000万)で居住面積が最小」と
      書いたが**誤り**。車庫・備蓄倉庫を除いた居住相当で並べ直すと、下から
      中十条4 nc_6990281280=71.0 / 赤羽西3=78.9 / **本物件=80.3(下から3番目)** /
      赤羽西4=88.0(車庫12.35は別途) / 西が丘2 nc_21096431=**約90.6**(掲載延床104.69は
      車庫11.66+備蓄倉庫2.43を含む) / 中里3 nc_21439305=94.4。
      当初の比較で「西が丘2は+500万で居住+24.4m2」とした差も、正しくは**+10.3m2**。
      なお容積率の計算では車庫は不算入(延床の1/5まで)で、(90.89-10.59)/55.09=145.8%≦150%と整合する"
    check: "車庫を居住に転用する余地(車を持たない場合)。転用すると容積率オーバーになるため、実際には不可の公算"
  - title: "接道の方位が資料内で矛盾している(図面の見出しとSUUMOのキャッチは『北西・南西』、物件概要欄は『北東・南東』)"
    effect: "日照の向きが180度変わる。2階リビングの採光評価が逆になる"
    detail: "販売図面の見出しは『南西・北西角地の駐車場付3LDK』、SUUMOのキャッチも『北西・南西側接道の3階建住宅』。
