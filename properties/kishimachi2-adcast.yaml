      **つまりこの欄は本物件で埋められていないだけ**で、台帳の既知の穴1そのもの。
      公式マップを約18mメッシュで走査すると、岸町1〜2丁目に急傾斜地の崩壊の
      **特別警戒区域(レッド)18点・警戒区域(イエロー)56点**の帯が実在する(丁目代表点の照合では0点=取りこぼす)。
      徒歩分から絞った推定位置からレッドまで94〜211m・イエローまで62〜194m。
      崖の上側にあたる岸町2丁目2番は標高17.5mで**イエローまで9m・レッドまで51m**"
    check: "番地確定後に geohazard.mjs で再照合。がけ条例(東京都建築安全条例第6条)と擁壁の有無、
      **宅地造成工事規制区域の該当有無**(同じ岸町2の土地 nc_21089174 には明記があった。本物件の
      SUUMO制限欄は空欄だが空欄は非該当の証拠にならない)を役所・現地で"
  - title: "適正中央値は岸町の土地水準を1円も見ていない(リテール比較65%の事例21件はすべて上十条・中十条)"
    effect: "岸町の土地成約較正値185万/坪を採ると適正中央値は7,368万→7,180万(売出とちょうど同額)へ下がる"
    detail: "engine/retail.js の normalizeLandUnit は時点・徒歩・幅員を標準化するが**地区の水準は標準化しない**
      (buildDistrictIndex は『査定には不使用』と明記されている)。事例プールは近接地区限定=上十条14件・中十条7件で、
      岸町の成約は築0〜1年の該当がなく1件も入っていない。地区補正は subjectFactor=0.97(北東向き-3%のぶんだけ)で、
      **地区差はゼロ**。岸町の基準坪単価213万は較正185万(土地成約4件)と公示ベース240万(岸町1丁目17-14の
      公示2026 208万/坪×1.15)の50:50ブレンドで、両者は30%開いている。
      公示の地点は**岸町1丁目=王子駅至近の台地側**で、対象地(2丁目・標高6mの崖下)より条件が良い可能性がある。
      実測: 較正値185万/坪だけを信じると原価法6,570→6,033万・適正中央値7,368→7,180万で**乖離は+0万**になる。
      なおリテール比較の7,797万は**どちらのシナリオでも動かない**"
    check: "岸町の土地成約が増えるまで解消しない。当面は『適正中央値7,180〜7,368万』の幅で読む"
