#   (5) 市場の評価: 2026年5月完成・即引渡可で総戸数2が2戸とも未販売(3ヶ月超)。
#       周辺成約が示す7,000万水準が正しければ即完売するはずで、市場は査定より低く評価している
# 結論: 数値の誤りではなくモデルの盲点。実地確認(駐車可否・容積の内訳)までは割安判定を鵜呑みにしない
