#   (2) 容積率の要確認: 延床92.34/土地57.65=160.2%で指定150%を10.2pt超過。
#       兄弟は車庫の容積不算入(延床の1/5まで)で整合するが、本物件は不算入対象の記載がなく
#       約5.9m2分の根拠が不明。ロフト・備蓄倉庫等の可能性もあるが、既存不適格ならローン条件に影響
#   (3) 前面道路4m: 兄弟(4.2〜7m)中もっとも狭い。エンジンは4m以上を一律good_4m(±0%)とし減点しない
