caveats:
  - title: "参考プラン81.96m2は、指定容積160%の上限75.7m2を6.2m2超えている"
    effect: "プランどおり建たない可能性。延床は建物価値とリテール比較の両方に直結する"
    detail: "土地47.34m2 × 容積160% = **75.74m2**が上限だが、掲載の参考プランは81.96m2。
      6.22m2の超過を説明するには車庫・地下・ロフト等の容積不算入部分が要るが、掲載に記載がない。
      さらに**前面道路の幅員が掲載に無い**のが効く——法52条2項で実効容積は『幅員×0.4』に制限され、
      1種住居の指定160%を出すには幅員4.0m以上が必要。3.5mなら140%(=66.3m2)まで落ち、
      参考プランとの差は15.7m2に広がる。台帳では西ケ原4(前面3.3mで実効132%)が同じ論点で登録済み。
      **本YAMLは掲載どおり81.96で査定している**が、実効容積が確定するまでこの延床は暫定"
    check: "役所調査(建築課)で前面道路の幅員・42条区分・セットバックの要否と、容積不算入部分の内訳を確認"
  - title: "建物参考プランの価格が掲載により3つある(旧2,300万・旧キャプション2,480万・新2,200万)"
    effect: "総額が280万の幅で動く。price_history は各時点の物件概要の値で立てている"
    detail: "物件概要は『建物価格2300万円・建物面積81.96m2』、写真の建物プラン例キャプションは
      『建物価格２４８０万円・建物面積８１．９６m2』で、**面積は同じなのに価格だけ180万違う**。
      物件の特徴欄の『土地建物総額7970万円』は 5,670+2,300 と整合するため、
      price_history は2,300側で立てた。2,480が正なら総額8,150万になる。
      なお2,300万 ÷ 24.79坪 = **92.8万/坪(税込)**で、木造3階・準防火の実勢(坪80〜120万)の下寄り。
      付帯工事・給排水・外構・設計料が別計上かどうかで実際の総額はさらに動く"
    check: "販売図面で建物価格の内訳(本体/付帯/オプション)と、どちらの価格が正かを確認"
  - title: "**建築条件付**なので建築費を相見積で下げられない"
    effect: "岸町2(建築条件なし)と非対称。総額の下振れ余地が小さい"
    detail: "建築条件付土地は、一定期間内に指定の建築業者と請負契約を結ぶことが売買の条件になる。
      台帳の岸町2 MIRASUMO は**建築条件なし**で『相見積で建築費を下げられる』ことを利点として
      記録しているが、本件はその逆で建物価格は提示された額が実質的に固定される。
      条件を外す(土地のみ購入する)交渉が成立するかは売主次第で、成立しなければ総額7,970万が前提になる"
    check: "建築条件の期間(通常3ヶ月)と、条件解除の可否・その場合の土地価格"
  - title: "土地単価396万/坪は上十条の基準225万/坪の1.76倍"
    effect: "土地値主導の査定に対して売出が大きく上振れる"
    detail: "土地価格5,670万 ÷ 14.32坪 = **396万/坪**。エリア基準の225万/坪(2026-08-29に
      国交省の土地成約n=22の中央値224.9万/坪から新設)に対し176%にあたる。
      上十条は**公示地価の住宅地点が取得できず**(不動産情報ライブラリの地価公示APIをz=13/14/15で
      照会したが全て0件)、基準単価は土地成約だけに依存していて外部検算が効いていない点にも注意。
      ただし本件は十条11分で、基準を立てた成約22件の駅距離構成とは違いうる"
    check: "同じ上十条4丁目・徒歩10〜12分帯の土地成約を国交省APIで抽出して個別に比較する"
  - title: "土地先行取得の保有コストがエンジンに入っていない"
    effect: "総額7,970万の外に費用が乗る"
    detail: "岸町2で洗い出したのと同じ論点。①つなぎ融資の金利(年2〜3%なら半年80〜120万・1年160〜239万)
      ②更地は固定資産税の住宅用地特例(課税標準1/6)が効かず1月1日時点で判定される
      ③着工〜完成の間の二重の住居費 ④住宅ローン控除の入居年がずれる。
      本件は着工〜完成の期間が掲載に無く、built: 2027-06 は岸町2の営業説明に倣った想定値"
    check: "建築条件の履行期限、着工〜引渡しのスケジュール、つなぎ融資の要否と金利"
