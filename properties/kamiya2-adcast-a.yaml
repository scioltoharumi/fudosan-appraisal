source: "紙の販売図面((株)アドキャスト赤羽支店・取引態様=媒介・建築会社 アーキフォレスト)。**未公開物件**(2026-10-10時点でネット掲載なし)。
  ユーザーが2026-10-10に入手。建築条件付き売地・全2区画(A 有効宅地約47.52m2・延床約93.86m2 / B 有効宅地約43.77m2・延床約85.01m2)で、
  **図面に価格があるのはA区画のみ**。地番 神谷2丁目24番36 / 住居表示 神谷2丁目24番11(旧住居表示)。
  京浜東北線「東十条」11分 /「赤羽」14分 / 南北線「王子神谷」15分。市街化区域・第1種住居地域・60/200・準防火地域・第2種高度地区・日影4h-2.5h(4m)。
  接面道路 北側約6.0m 公道(42条1項1号)。所有権。引渡し 令和9年3月下旬予定。現況 古家有(解体予定)。
  標準仕様はZEH水準・耐震等級2相当(詳細はプレゼンで確認)。参考プランのロフトはオプションで面積・価格に含まれない。
  決済前案件のため取扱注意・司法書士と土地家屋調査士は売主指定。
  **建築請負契約の締結が停止条件**(本契約後100日以内に請負契約が締結できなければ自動解除・受領金は無利息で返還)"
