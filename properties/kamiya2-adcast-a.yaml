    naisui:
      # period_years は flood.html(図で読む版)が30年累積に使う数値(153mmは都の定義の1/1000を採用)
      rows:
        - {rain: "50mm", period: "約4年に1回", period_years: 4, depth: "ほぼ0(道路の一時冠水)", basis: "23区の下水道の整備水準=50mm/h。これ以下は想定上あふれない"}
        - {rain: "75mm", period: "約27年に1回", period_years: 27, depth_lo: 0.1, depth_hi: 0.2, depth: "0.1〜0.2m(床下。1階床は+0.46m。車庫・玄関は地面高さなので水)", basis: "都の75mm対策は重点地区のみ。深さは『153mmで0.83m』を雨量超過分に比例させた目安"}
        - {rain: "100mm", period: "約200年に1回", period_years: 200, depth_lo: 0.3, depth_hi: 0.5, depth: "0.3〜0.5m(1階床+0.46mの縁。上限0.5mでわずかに床上)", basis: "同上。東京の観測史上最大は88.7mm(1939)=約80年に1回"}
        - {rain: "153mm(想定最大)", period: "都の定義では1/1000級(Gumbel外挿は1/15,000・GEVなら1/2,000)", period_years: 1000, depth_lo: 0.83, depth_hi: 0.83, official: true, depth: "**0.83m(公式)**", basis: "都の浸水予想区域図の地点値(総雨量690mmの長時間降雨の結果。短時間型の深さをここから比例で引くのは近似)。1階床+0.461mなら床上約0.37m"}
      note: "**1階床 GL+0.461m(図面)で読み直すと、最もよく来る内水(75mm/h・30年で68%)の0.1〜0.2mは床下に収まり、居室への影響は限定的**。100mm/h(30年14%)の0.3〜0.5mは床の縁(上限でわずかに床上)、想定最大153mmの0.83mで床上約0.37m。ただし床下浸水も無傷ではない(床下の泥・消毒・断熱材の乾燥で10〜30万円級)、車庫・玄関ポーチは地面高さで75mmでも水が入る、基礎の換気口・配管貫通部の高さと止水で床下への浸入量が変わる、の3点は残る。内水は『大丈夫』ではないが、この床高なら頻度の高い帯は床下で受け止められる形。ただし**内水で1m以上は想定最大でも届かず(±300mの最大1.97m)、3m以上は0点**。
        外水の『3〜5m』とは機構も確率も別で、内水の方が浅く・頻度は高い。水は数時間で引く(都道府県レイヤの継続時間は12時間未満)。気候変動で短時間雨量が1.1倍(2℃)になると、Gumbelの裾は指数なので超過確率は1.4〜3倍=**上の再現期間は概ね半分**(75mm 27→16年・100mm 200→96年)。都は2023年12月に下水道の目標降雨を10mm引き上げた(区部75→85mm)。153mmの再現期間は分布形で桁が動く(GumbelのMLE/L-momentで1.2〜2万年・GEVなら約2,000年)=外挿で、都の『1/1000級』の読みを添えておく"
    assumptions:
      - "破堤は『1洪水に1か所・どの破堤点でも同じ確率』。荒川下流の破堤点は計画規模182・想定最大211(左岸を含む。届くのは全て右岸12〜29km)で、右岸(北区側)19〜22kmの破堤がこの地点を最も深くする(4.0〜4.4m)。堤防の弱点が北区側に偏っていればこの表より高く、対岸に偏っていれば低い。**1か所の単純化は確率を下げる側**: 複数破堤(ポアソン)を許した値を表の下に併記する"
      - "計画規模〜想定最大の帯の深さは、帯の下端の図(計画規模・516mm)と上端の図(想定最大・632mm)の届く割合の平均で置く。当初は下端の図だけで代表させており3m以上が系統的に低く出ていた(検算で修正)"
      - "『5m』は公式の単一破堤・632mm以下の計算の範囲では出ない(最大4.4m=右岸21.0km破堤)。ハザードマップの『3.0〜5.0m』は区分の上限であって地点の最大値ではない。ただし632mmを超える雨や19〜22kmの二重破堤は公式計算の外で、上限は未計算=5m超が物理的に起きないという意味ではない"
      - "30年累積は 1−(1−p)^30。気候変動は国交省『気候変動を踏まえた治水計画のあり方』(2℃上昇で洪水の頻度約2倍)を年確率に掛ける。×2は今世紀末の頻度を初年から30年全部に当てた上限で、線形に上がるランプの平均は×1.3。2024年の荒川の基本方針変更は気候変動分(基本高水15,800m³/s)を施設で吸収して1/200を保つ計画で、荒川第二・第三調節池(2030年頃)は現行のハザードマップにもこの表にも入っていない(入れば下流水位が下がり、表は高めに出る側)"
      - "破堤点の間隔(16〜22kmは0.25km・22km以降は0.2km)により点数の重みは延長の重みと最大25%ずれ、計画規模と想定最大で破堤点の集合自体が違う(182件と211件)。いずれも桁には効かない"
    conclusion: "外水で**1m以上は30年で約2.2%(幅1.4〜3.0%)・3m以上で約1.4%(0.9〜1.8%)・4m以上で約0.3%・5mは公式の単一破堤計算の範囲では0**(複数破堤を許すと 3.0 / 2.0 / 0.4%)。
      気候変動は ×1.3(ランプ平均)で1m以上2.8%・3m以上1.8%、×2(上限)で4.3%・2.8%。
      つまり『3〜5m』の確率は100年に1回級ではなく**1,000年に1〜数回級**で、起きるときは2〜4mの水が2週間以上引かない。内水は別系統で、床上の縁(0.3〜0.8m)が100〜1,000年級。
      決め手は深さの確率より**『起きたら1〜2階全損+長期退去』を保険(水災)と資金で受けられるか**と、垂直避難(3階)で命が守れる設計(氾濫流の区域外・木造3階)かどうか。
      **2026-10-11の別コンテキスト検算で改訂**: 当初は 1m 2.8% / 3m 0.9% だったが、帯の深さを下端の図で代表させる階段近似が3m以上を低く出していたため、帯の中央(L1図とL2図の平均)に置き換えた"
    sources: "国交省 浸水ナビ(2026-10-11取得・破堤点別最大浸水深) / 東京都オープンデータ shinsui_sumidagawa.csv(2022-04) / 気象庁 東京の年最大1時間降水量(1921〜2025) /
