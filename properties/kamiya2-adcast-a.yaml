# 来週(2026-10-10時点の翌週)に建物のプレゼン→契約と言われたので、プレゼンで聞くことを一覧にした(ユーザー要望「チェックリストを物件ページに載せて」)。
# 指値・交渉の手の内は書かない(運用ルール3)。答えが出たら status_updates に事実として記録し、総額と比較ページを実数で直す
questions:
  title: "プレゼン前に聞くこと(10/10作成)"
  note: "土地売買契約 →100日以内→ 建築請負契約の2段階。建物の細部は請負で確定だが、土地契約で建築会社は替えられなくなる=建物側の答えは土地契約前に書面で"
  groups:
    - head: "価格が動くもの"
      items:
        - "建物2,490万の内訳: 本体 / 付帯(給排水接続・仮設・外構・地盤改良) / 設計料 / 諸経費。付帯別なら総額が変わる"
        - "標準仕様書+オプション価格表: ロフト(はしご/固定階段)・UB1616・網戸・カーテンレール・照明・TVアンテナ・エアコン配管"
        - "UB1316→1616: 間取りと差額(納戸4.3帖→何帖か・耐震等級2を保てるか)"
        - "**3階7.9帖を将来2室(約4帖×2)に分けられるか**: 寸法 約4.1×3.2m・入口は階段側の短辺1ヶ所 → 縦割り=幅1.5mで部屋にならず / 横割り=奥(バルコニー側)に廊下からの入口なし / 廊下を通すと手前2.9+奥4帖 = **今の間取りのままでは成立しない**(奥の採光は隣家側の高窓で可。障害は入口)。
           聞くのは『**3階を約4.5帖×3室に組み替えられるか**』: 階段を端へ寄せ廊下1本 / 吹抜とロフト5.1帖は消える / 耐震等級2の耐力壁配置 / 追加費用と工期。
           プラス1室の代替: ①7.9帖を2人で共用(2段ベッド)+7.3帖を主寝室 ②1F納戸4.3帖を個室に(法律上は納戸=採光基準外。机とベッドは入る。温熱・窓・エアコン配管を確認)"
        - "ロフト無しの場合: 7.3帖の天井高と屋根裏はどうなるか"
        - "地盤改良費: 調査時期(古家解体後か)・請負契約時に未確定なら上限や『○万円まで込み』の有無"
        - "設備負担金60万: 内訳(給排水・ガス・電気のどこまでか)・支払先・時期"
    - head: "契約条件"
      items:
        - "請負契約の期限 / 着工金・中間金の有無 / ローン実行形態(土地決済時の分割実行か、完成時一括か)"
        - "引渡し2027年3月下旬の確約度・遅延時の扱い"
        - "真北調査・天空率・構造計算でのプラン変更(図面注記)の具体的な中身・変更時に価格は動くか"
        - "土地契約の手付金額・ローン特約・解除条件"
    - head: "この土地ならでは"
      items:
        - "基礎高・1階床高(浸水3〜5mの土地で基礎を上げられるか・費用)"
        - "B区画との位置関係(どちらが道路側か・隣家との距離・南側隣地に何が建つか=日当たり)"
        - "耐震等級2・ZEH水準の証明書類(住宅性能評価・BELS等)=フラット35S・地震保険割引・住宅ローン控除の区分に直結"
        - "10年瑕疵保険・アフター点検の体制・アーキフォレストの施工実績"
caveats:
  - title: "洪水浸水想定3.0〜5.0m(荒川・想定最大規模)の低地=掲載条件『台地側』の例外"
    effect: "水害時は1階(車庫・ポーチ)が水没。浸水継続時間の区域=数日〜数週間の孤立あり。出口の買い手層は台地側より狭い"
    detail: "住居表示の点: 標高2.5m・3.0〜5.0m・被覆100%(±40m 81点)。木造3階の2階床高(約3m)に届く深さ。高潮でも0.5〜3.0m。
      L1(1/200)は区域外=『1000年級のときだけ』だが、台帳の他物件(岸町2=0.5〜3.0m)より一段深い。氾濫流の区域外=流れで建物が壊れる範囲ではない。
      **10/10ユーザー指示で許容**。map.html の浸水深×木造3階建の高さ比較図を参照"
    check: "北区洪水ハザードマップ(荒川版)の避難所・経路 / 基礎高と1階の用途(車庫なら実害は限定的) / 水災保険の条件"
  - title: "総額6,580万の外: 設備負担金60万(税込)・地盤改良費・ロフト・UB1616"
    effect: "最低6,640万+地盤改良。ロフト50〜150万+UB1616 10〜25万(+間取り調整)で**実質6,800〜6,950万**。荒川低地の軟弱地盤は改良費がかさみやすい"
    detail: "図面注記『設備負担金60万円(税込)及び地盤改良工事費用が別途』。低地の沖積層は柱状改良100〜200万が相場(assumed)。ロフトはオプション(価格外)。
      price_history は図面合計6,580万。実質6,700〜6,900万+ロフト/UB で読む"
    check: "地盤調査の有無と改良費見積 / 設備負担金の内訳(給排水引込・ガス等) / オプション単価"
  - title: "**建築条件付**(アーキフォレスト・100日以内の請負契約が停止条件)"
    effect: "建築費の相見積 不可=建物2,490万(税込・坪87.7万)は実質固定。逆に軽い費用も4つ(下記)"
    detail: "100日以内に売主指定の請負契約が成立しなければ自動解除(受領金は無利息返還)。坪87.7万(93.86m²=28.4坪)は木造3階・準防火の実勢(80〜120万)の下寄り=ZEH水準・耐震等級2相当の標準仕様の範囲。
      付帯工事の内訳は図面になし。上十条4(建築条件付)と同型 / 岸町2 MIRASUMO(条件なし)とは非対称。
      **建築条件付だから軽い費用**: ①仲介手数料は土地分のみ(約142万。建売なら約224万) ②請負契約の印紙税は売買より軽い
      ③受注生産=建売の在庫リスク料が乗らない(同じ帯の建売 査定+400〜2,500万に対し本件+184万) ④請負契約前の間取り・仕様変更は標準の範囲で追加費用なし(建売の後付けより安い)"
    check: "請負契約の標準仕様書 / 本体・付帯・外構の内訳 / プレゼン資料の間取り"
  - title: "査定の延床は住宅部分83.10m²(図面の93.86は車庫8.13・ポーチ2.63込み)"
    effect: "93.86なら適正6,691万・乖離−111万 / 83.10で適正6,396万・乖離+184万。他物件は掲載の延床(車庫込みも)のまま=神谷だけ厳しめ"
    detail: "参考プラン図(Each floor ground plan A・2026-10-08・1/100): 1F 21.68(住宅)+8.13(車庫)+2.63(ポーチ・容積算入) / 2F 30.71 / 3F 30.71。
      建築面積30.71=9.100×3.375 → 建ぺい64.64%(60(70)%)。容積対象85.73÷47.52=180.42%。
      **2LDK+S**: 1F 玄関・ホール・洗面脱衣・UB1316・トイレ・洋室(納戸)4.3帖 / 2F LDK17.4帖+バルコニー3.07 / 3F 洋室7.9帖(上部吹抜11.62m²)+7.3帖(カウンター)+CL×2+バルコニー3.07。
      **ロフト5.1帖**(7.3帖の上・吹抜に面する)は図面にあるがオプション=価格外。小屋裏(1.4m以下)=延床に不算入。2.47×3.375=約8.3m²で、収納に使えば体感83.10+8.3=**約91m²相当**(天井1.4m以下・はしご・夏は屋根直下で暑い・居室にならない・査定に入れない)。
      車庫: 幅2.225m(芯々)×内部約3.65m+前面2.275mの張り出し下=約5.9m。ポーチ幅1.15m。
      図面注記: 行政・検査機関との協議 / 天空率 / 構造計算(壁の追加・位置変更) / 真北調査後 でプラン変更の可能性"
    check: "UB1316→1616の可否・差額・削られる部屋(寸法上は納戸4.3帖を約45cm縮め約3.5帖が現実的) / ロフトの価格と無しの場合の天井高・屋根形状"
  - title: "土地単価284.6万/坪=神谷の基準205万/坪の1.39倍"
    effect: "土地値主導の見方では売出が上振れ。基準単価は10/10新設=較正の信頼度 低"
    detail: "土地4,090万÷14.37坪=284.6万/坪。基準205=国交省 神谷・住宅地の土地成約(2022+・n=16・中央値206.6万)、隣接の志茂(201)と整合。
