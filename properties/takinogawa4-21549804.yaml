      これが2026-08-29に『予算帯超え』で登録を見送った理由。**建築条件なしの掲載が出たことで土地単体の条件を通った**が、
      戸建としての総額は変わらない。土地カテゴリの価格上限7,500万(Claudeの既定・要調整)はこの物件で上限の意味を問われている"
    check: "土地7,198万+建築費の総額で予算を判断する。建築費は相見積(建築条件なし)"
