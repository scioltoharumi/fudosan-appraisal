    effect: "どちらの仲介から買うかで総額と自由度が変わる"
    detail: "同じ区画を2社が別条件で出している。アドキャスト掲載(nc_21551661)は掲載区分が『建築条件付土地』で
      『土地のみの価格です』『建物プラン例 建物価格3300万円・建物面積121m2』。ハウスプラザ掲載(nc_21549804)は
      建築条件欄「-」で本文に『お好きなハウスメーカーで自由に建築』。**売主が建築条件を付けているのか、
      仲介が自社の建築で条件付にしているのか**は不明。建築条件付だと相見積が使えない(上十条4・岸町2で整理済み)"
    check: "売主の建築条件の有無を両仲介に確認。建築条件付の場合は条件の期間と解除の可否"
  - title: "前面6.7mの公道で+10%の加点、北向き接道"
    effect: "土地換算値を押し上げる"
    detail: "エンジンは幅員6m超に一律+10%(2026-08-13に国交省API実測で新設。6超〜8mは+21.4%・CI 10.2〜39.3の保守側)。
      台帳では赤羽西4(8m)に続く2件目。北接道なので南向きの採光は隣地次第(1種中高・第2種高度地区で隣地の高さは制限される)"
    check: "現地で道路幅員の実測・南側隣地の建物高さ"
  - title: "土地先行取得の費用がエンジンに入っていない"
    effect: "土地7,198万の外に費用が乗る"
    detail: "①建築費(上記)②つなぎ融資の金利(年2〜3%なら半年72〜108万・1年144〜216万)
      ③**更地は固定資産税の住宅用地特例(課税標準1/6)が効かない**(1月1日時点で判定。現況駐車場も特例なし)
      ④着工〜完成の二重の住居費 ⑤住宅ローン控除の入居年がずれる。
      建築条件なしで買えるなら相見積で建築費を下げられるのは有利な側の非対称"
    check: "建築費の相見積(3社)、つなぎ融資の要否と金利、引渡し時期(掲載は『相談』)"
