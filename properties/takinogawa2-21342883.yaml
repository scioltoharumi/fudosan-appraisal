caveats:
  - title: "有効37.4m2×実効容積132%=延床上限約49m2で、台帳の掲載条件(延床70m2超)を満たす家が建たない公算が高い"
    effect: "**土地カテゴリの掲載条件(45m2以上)を通ったが、戸建としては圏外相当**。登録は規約どおり行い、この事実を先頭に置く"
    detail: "登記49.1m2から私道負担9m2(SUUMO)とセットバック2.70m2(athome)を引くと有効約37.4m2。前面3.3mの2項道路なら
      法52条2項で実効容積は3.3×0.4=**132%**(指定の160%・200%は効かない)→延床上限 約49m2。建ぺい60%で1階22m2。
      3階建てにしても70m2に届かない。**土地カテゴリの掲載条件『45m2以上』は『実効容積160%で延床72m2』の翻訳(Claudeの既定)**なので、
      前面3.3m・私道負担・セットバックが重なるとこの翻訳が破れる。掲載条件に『有効面積×実効容積≧70m2』を足すかは方針変更=ユーザー判断"
    check: "区画図・確定測量図で有効面積、役所で42条区分と後退線、43条・52条の計算"
  - title: "建築条件付き(athome明記・SUUMOは「-」)。建物価格が無いので総額が読めない"
    effect: "相見積で建築費を下げられない。総額は 4,480+建築費(指定業者)"
    detail: "athomeの条件等『建築条件付き』・備考『土地売買契約後3か月以内に売主(又は売主の指定する建設業者)と建築請負契約』。
      SUUMOの建築条件欄は「-」で食い違う(上十条4の再掲載でも同じ現象があった=SUUMOの欄は信用できない)。
      参考プランも建物価格も掲載に無いため、上十条4(建物2,200万)のように総額を立てられない。土地4,480万は坪301.6万で
      滝野川の基準214万/坪(2025年1月)の**1.4倍**——建築条件付土地は土地価格を高くして建物で調整する値付けが多いので、
      総額でしか比較できない"
    check: "指定業者・建物の標準価格・条件の期間と解除の可否を仲介に確認"
  - title: "地勢『傾斜地』。造成・擁壁・がけ条例の論点"
    effect: "建築費の上振れ。高低差2m超ならがけ条例(東京都建築安全条例6条)"
    detail: "athomeが地勢を『傾斜地』と明記。土砂災害区域の指定は無い(機械照合)が、区画内の高低差は25mメッシュの標高では見えない。
      更地渡しなので既存擁壁の有無・状態は現地で見る。がけ条例は高低差2m超の崖の上下30度線で建築制限が掛かる"
    check: "現地で高低差・擁壁。役所でがけ条例の適用有無"
  - title: "土地先行取得の費用がエンジンに入っていない"
    effect: "土地4,480万の外に費用が乗る"
    detail: "①建築費(指定業者。延床49m2なら坪80〜120万で1,190〜1,780万)②つなぎ融資の金利 ③更地は固定資産税の住宅用地特例(1/6)が効かない
      ④二重の住居費 ⑤住宅ローン控除の入居年がずれる。建築条件付なので相見積の効きは無い"
    check: "建築条件の履行期限、着工〜引渡しのスケジュール、つなぎ融資の要否"
