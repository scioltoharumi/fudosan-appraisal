caveats:
  - title: "耐震等級が掲載に一切記載なし"
    effect: "査定に未反映"
    detail: "SUUMO・athomeとも耐震等級・住宅性能評価書の記載がなく、athomeの「評価・証明書」欄も「－」。
      確定しているのは①2026年の建築確認なので新耐震・2000年基準はもちろん現行基準に適合
      ②木造3階建は構造計算(許容応力度計算)が法的に必須で、2階建の壁量計算のみとは審査の厚みが違う
      ③建ぺい率の緩和(C70%/D80%)から準防火地域の耐火建築物等または準耐火建築物等であることが確定(火災保険はT構造扱い)
      ④品確法により構造耐力上主要な部分は10年の瑕疵担保責任、履行法により保険加入または供託が義務。
      不明なのは耐震等級そのもの。等級3なら普通は売り文句にするため、等級1(基準法レベル)の可能性がある。
      ハウスプラザ掲載は「全棟フラット35S利用可」と記載するが、**フラット35Sは省エネ・耐震・バリアフリー・
      耐久性可変性のいずれか1分野で基準を満たせば使える**ため、S利用可は耐震等級2以上の根拠にならない。
      なお同掲載のエネルギー消費性能・断熱性能・目安光熱費の欄はいずれも「－」。
      本物件はビルトインガレージ付きの狭小木造3階建=1階正面が大開口で耐力壁が制約される典型形のため、
      構造計算の中身(1階の耐力要素・基礎)を見る価値が大きい。査定エンジンは耐震等級を変数に持たない"
    check: "住宅性能評価書(設計・建設)の有無と耐震等級 / フラット35Sの適合分野とプラン / 構造計算書(許容応力度計算)の写し / 地盤調査報告書と地盤改良の有無・工法 / 長期優良住宅認定の有無 / 「基礎配筋検査+4回の住宅検査」の実施主体(第三者か自社か)と検査報告書 / 住宅ローン控除の省エネ証明書類(建設住宅性能評価書または住宅省エネルギー性能証明書)が引渡しまでに交付されるか(建築確認2026年=省エネ基準適合の義務化後なので適合は制度上の前提だが、確定申告には書類そのものが要る。ZEH水準以上なら控除の借入限度額が上がるため区分も書面で確認)"
