caveats:
  - title: "事例プールの汚染は2026-08-29に幅員で解消したが、残る事例は全地区から借りている"
    effect: "解消済み(ただし地区の統制は緩い)"
    detail: "登録当初、比較事例5件が 52〜223万/坪 と4.3倍に割れ、市場実勢中央値が1,564万まで落ちていた。
      国交省APIの生データまで遡ると5件はすべて実在するが、前面道路の幅員が
      1.2m / 1.7m / 記載なし×2 / 2.5m で、**最も安い2件は接道義務(建築基準法42条)を満たしていなかった**
      =再建築不可相当。台帳ならKO1で候補から落とす条件のものを、ものさしの側には入れていた。
      2026-08-29に engine/retail.js へ①幅員1.8m未満の事例をプールから除外②残る事例の幅員を
      標準条件4〜6mへ正規化、の2点を入れて解消した(実測: 標準条件比 2.0m以下 −40.4%・
      2.7〜4.0m −6.3%・6m超 +14.5%、いずれも95%CIが0を跨がない)。
      結果、市場実勢中央値は1,564万→3,123万となり**原価法中央値3,306万とほぼ一致**した
      (両手法の比 0.47→0.94)。
      **残る限界**: 2件を外したことで近接地区の事例が5件を割り、プールが全地区へ拡大している
      (物件ページに『近接事例不足のため全地区・参考』と表示される)。上十条・中十条・十条仲原の
      築40年台の成約そのものが薄いという供給側の事実で、標本が増えるまで解消しない"
    check: "上十条周辺で築36〜48年・土地28〜75m²の成約が5件以上たまった時点で再評価する"
  - title: "エンジンは2026年1月のリフォームを1円も評価していない(査定は過小の方向)"
    effect: "実測では3,400〜3,800万相当・エンジンは3,265万"
    detail: "築42年 > 耐用年数40年のため建物残価が0になり、水回り交換+内装全室のリフォーム済であることが
      原価法・リテール比較のどちらにも入らない。加えて繰延修繕400万を控除している。
      事例側でも統制できない——国交省データの改装列(Renovation)は**戸建4,770件すべて空欄**で、
      マンションにしか記録がないため。
      同じ北区のマンションで代理測定すると改装済みプレミアムは築36年以上で**+38.7%**(95%CI +33.7〜+43.8)だが、
      築古の改装済みは買取再販業者の物件が大半で、この数字は『改装の価値』ではなく
      **『改装+業者利益+販売コスト』の合計**。分離できないためエンジンには入れず、開示に留めた
      (2026-08-29ユーザー判断)。目安として2経路で当てると:
      ①未改装の実勢(土地値3,551万×0.814=約2,900万)＋改装プレミアム38.7% = 約4,010万
      ②未改装の実勢 約2,900万 ＋ 工事費実費(水回り+内装全室で一般に500〜900万) = 3,400〜3,800万。
      **どちらの経路でもエンジンの3,265万より150〜750万高い**"
    check: "リフォームの範囲と実施内容(工事明細)、外壁・屋根・防水・給排水管が対象に含まれていたか"

  - title: "売出7,950万を説明する変数は、5つ測ってどれも見つからなかった"
    effect: "乖離は物件属性ではなく売主の値付けに帰する"
    detail: "『何か決定的な変数を見落としているのでは』という問いを受けて、地区・期間を統制して実測した結果:
      ①**鉄骨造**(本件はRCではなく鉄骨。法定耐用年数はRC47年に対し鉄骨34年)——生で測ると木造比+81.3%だが、
      これは**延床/土地比の交絡**(中央値は木造1.10に対し鉄骨1.88・RC2.71。狭い土地に大きな延床を載せる構造)。
      建物/土地比を揃えると **−28.7%(CI −32.2〜−22.8)と符号が逆転**する。築古の鉄骨は解体費が木造の約1.4倍・
      壁を抜きにくくリノベの自由度が低い・担保評価も出にくい。**『頑丈だから長く使える』を買い手は価格で払っていない**
      ②**容積率300%・近隣商業** 差0.2%(CI −7.7〜+10.1・n=112)=判別不能
      ③**徒歩6分**(10分未満の加点) 9-10分基準で5-6分 −0.8%(CI −5.7〜+5.4)=判別不能
      ④**狭小地47m²のプレミアム** 40-55m²帯 +10.0%(CI −2.3〜+17.3)・面積の弾力性0.953(CI 0.884〜1.025で
      1.00を含む)=判別不能。土地は面積に比例で説明できる
      ⑤**リフォーム**——唯一効くが、上記のとおり業者マージンと分離できない。
      積み上げると『未改装の実勢 約2,900万 + 工事費500〜900万 = 業者の原価まわり3,400〜3,800万』に対し
      売出7,950万は**約2.1〜2.3倍**。買取再販の通常のマークアップは1.3〜1.5倍で、この倍率は説明がつかない。
      なお全ルート中で最も高い収益価格(想定賃料22万・利回り4.5%)でも4,987万"
    check: "同種の買取再販物件の売出→成約の値引き幅。売主(株)マーケッターズの仕入時期と仕入価格(登記簿)"

