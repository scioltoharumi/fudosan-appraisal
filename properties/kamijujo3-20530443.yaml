  - title: "築42年の鉄骨造で、躯体・外装・設備の更新履歴が不明"
    effect: "繰延修繕400万は想定値"
    detail: "2026年1月に水回り設備交換(キッチン・浴室・トイレ)と内装全室のリフォームが完了しているが、
      外壁・屋根・防水・給排水管の更新履歴は掲載に無い。鉄骨造は鉄部の防錆処理が寿命を左右し、
      未処理なら躯体補修が必要になる。繰延修繕は既定800万ではなく400万を置いたが実見積ではない"
