caveats:
  - title: "建築条件付: 3ヵ月以内に売主指定の建築会社と請負契約。建物価格は最小プランの2,500万で総額8,980万=掲載条件の帯(〜9,000万)ぎりぎり"
    effect: "相見積で建築費を下げられない。109.94m2プラン(3,200万)を選ぶと総額9,680万で帯を超える"
    detail: "掲載に施工例として2プラン(79.76m2・2,500万 / 109.94m2・3,200万)。坪単価は 2,500÷24.1坪=104万/坪・3,200÷33.3坪=96万/坪で、**防火地域**の耐火要求を考えると実勢の中〜上。建築条件付は建物価格が実質固定(上十条4 kamijujo4-21594160 と同型)。仲介手数料は売主直販なので0(fee_rate 0)"
    check: "請負契約の内容(仕様・付帯工事・外構・地盤改良の別途費用)。建築条件を外す(土地のみ)交渉の可否"
  - title: "商業地域(80/240・防火地域)の土地を戸建用に買うと、払ったぶんを出口で回収しきれない"
    effect: "土地単価に商業プレミアムが乗るが、木造戸建として売るときには一部しか戻らない"
    detail: "北区の取引データで地区×5年帯を統制した実測(2026-09-02): 土地の坪単価は商業地域が住居系より+85.6%(CI +55.6〜+113.0)、木造戸建として売るときに戻るのは+20.1%(CI +5.0〜+45.5)。6,480万÷22.96坪=282万/坪は滝野川の基準247万の1.14倍。容積240%は戸建(延床80m2)では44%しか使わない。**防火地域**は木造3階で耐火建築物(または準耐火+条件)が要求され建築費が上振れ"
    check: "同じ滝野川5丁目・商業地域の土地成約を国交省APIで抽出。防火地域での木造3階の仕様と費用"
  - title: "東側隣接地からの被越境0.27m2(掲載明記)"
    effect: "建替え・売却時に越境の覚書が要る"
    detail: "隣地の構造物(屋根・塀等)が0.27m2越境している。是正か覚書(将来の建替え時に解消)の合意が引渡し条件に入るか要確認。金融機関によっては覚書を求める"
    check: "越境物の種類と、売主が越境の覚書を取得済みか。測量図"
  - title: "3駅の徒歩分(新板橋5/板橋7/西巣鴨8)が地理的に両立しない"
    effect: "位置を絞れず、区画のハザード照合は代表点のみ"
    detail: "siteFromWalk で単一迂回率(1.15〜1.40)・駅ごと独立(1.10〜1.50)とも解集合が空。どれかの徒歩分が丸められているか誤っている(赤羽台3・滝野川4で同型の実例)。滝野川5丁目は全体が標高25m前後の台地で、代表点±200mに土砂・3m超浸水は無い"
    check: "番地の特定→±40m走査。現地で各駅までの実歩行分数"
  - title: "土地先行取得の費用がエンジンに一切入っていない"
    effect: "土地価格6,480万の外に費用が乗る"
    detail: "①建物価格は請負契約(建築条件付)で実質固定・相見積で下げられない ②つなぎ融資の金利(年2〜3%なら半年〜1年で土地価格の1〜3%) ③**更地は固定資産税の住宅用地特例(課税標準1/6)が効かない**(1月1日時点で判定) ④着工から完成までの二重の住居費 ⑤住宅ローン控除の入居年がずれる"
    check: "建築費の相見積(3社)、つなぎ融資の要否と金利、着工〜引渡しのスケジュール"
