  # 「どのクラスの雨で・何が起きる想定か」を1枚で読むための表。数値の出典は sources 欄
  rain_scenarios:
    created: 2026-08-31
    rows:
      - label: "特別警報クラス(令和8年8月千葉豪雨を参考)"
        definition: "気象庁が「数十年に一度」の大雨で出す警報の最上位。千葉では線状降水帯により22市町に発表された"
        rain: "実測: 1時間115mm・24時間364mm(アメダス千葉・観測史上1位)"
        impact: "**家屋被害級の浸水想定なし**。都の浸水予想区域図(中小河川・内水)はこれを上回る前提
          (時間最大153mm・総雨量690mm)の計算で非該当。残るのは一時的な道路冠水級。
          **このクラスの雨で現実に効くのは南西30〜60mの急傾斜地警戒区域の帯**
          (崖崩れのトリガー帯=避難情報の対象圏に入りうる)"
        note: "短時間集中型は中小河川・内水に効く雨で、荒川を溢れさせる形(流域3日間の総量)ではない。
          石神井川は2010年に下流の堀船周辺で溢水実績があるが、当地は浸水予想区域外"
      - label: "計画規模(L1)"
        definition: "河川整備の目標規模。荒川は年超過確率1/200(カスリーン台風実績を約200年に1回へ引き伸ばし)"
        rain: "荒川流域 3日間548mm"
        impact: "**区域外**(堤防決壊の計算をしても色が付かない。2026-08-30タイル実測)"
        note: "堤防・調節池・岩淵水門の操作はこの規模まで守る設計"
      - label: "想定最大規模(L2)"
        definition: "想定し得る最大規模の降雨(年超過確率1/1000程度)。水防法ハザードマップの既定表示"
        rain: "荒川流域 3日間632mm(平成28年5月30日指定)"
        impact: "**浸水0.5〜3.0mの縁**(区画は「0.5m未満」との区分境界上=標高からの逆算で概ね数十cm〜1m弱)。
          浸水継続時間・家屋倒壊等氾濫想定は非該当"
        note: "京浜東北線の東の低地(志茂・岩淵・東十条…)が3〜10m水没するシナリオで、低地を満たした水の
          縁が崖下に届く絵。地点の確定値は浸水ナビ・北区の荒川版マップ・重説で"
    conclusion: "水は「特別警報クラス(千葉級)なら公式想定上リスクなし・200年級の荒川決壊計算でも区域外・
      色が付くのは千年級のときの縁の浅い水だけ(30年居住の累積で2〜3%程度の目安)」。
      **この土地のハザードの本丸は水ではなく、南西30〜60mの急傾斜地の帯と宅地造成工事規制区域**——
      現地・指定図書の確認はそちらに力点を置く"
    climate_note: "**「千年に1回」の読み方と気候変動**(2026-08-31追記)——
      ①632mmは秩父から東京まで**流域全体(2,940km²)の平均雨量**。西日本豪雨や千葉の「600mm超」は
      一地点の値で別物。2019年台風19号では荒川上流の地点で647mmが降ったが、流域平均は計画規模
      (548mm)にも届かず本川の堤防は保った(決壊は支川)。
      ②「1/1000」は確率計算ではなく、**関東で実際に降った最大級の雨を荒川の上に置いた想定**に
      添えた目安。「確率は不確かだが、物理的に起こりうる最悪級」と読むのが正確。
      ③気候変動で頻度は上がる方向。国の公式見積もりは**2℃上昇で洪水の頻度×2、4℃で×4**
      (国交省は治水計画を将来気候込みへ改定中)。30年累積2〜3%の目安は**将来は2倍(4〜6%)まで**見ておく。
      ④それでもこの区画の結論は変わらない: 上の表は既に最悪級の絵で、気候変動が動かすのは頻度だけ。
      頻度が上がるほど、深く長く浸かる低地とこの「縁」の差は**むしろ開く**"
    sources: "国交省 荒川下流河川事務所の洪水浸水想定区域図(平成28年5月30日指定・水防法14条) /
      東京都建設局 浸水予想区域図検索(2026-08-30実査で非該当) / 令和8年8月千葉豪雨の観測値(アメダス千葉) /
      気候変動の倍率は国交省「気候変動を踏まえた治水計画のあり方」提言(令和3年4月改訂) /
      タイル照合は crawler/geohazard.mjs(2026-08-30)。「逆算」「目安」と書いた値は公式の地点値ではない"
caveats:
  - title: "建物1,670万は29.55坪で**坪56.5万(税込)/51.4万(税抜)**。実勢の木造建築費を大きく下回る"
    effect: "エンジンは建物を再調達95万/坪=2,808万で評価している。この差1,138万が査定を押し上げている"
    detail: "2026年の木造3階建・準防火地域の建築費は坪80〜120万が相場で、ローコスト系でも坪60〜70万。
      51.4万/坪(税抜)は**本体工事のみで付帯工事が別**か、**仕様を大きく割り切っている**かのどちらか。
      図面にも『オプション品には別途費用が掛かります』『追加工事・オプション品には別途費用が掛かります』とある。
      **同じ家を再調達95万/坪で建てるなら総額は 5,810+2,808 = 8,618万**で、図面の7,480万より1,138万高い。
      逆に言えば、**1,670万で本当に95万/坪相当の家が建つなら1,138万ぶん得**、建たないなら査定はその分だけ楽観"
    breakeven: "**分水嶺は建築費 坪76.0万(税込)**。適正中央値8,056万 − 土地5,810万 = 建物に払える上限2,246万で、
      29.55坪なら坪76.0万。図面の56.5万/坪からここまでの**余裕は576万**しかない。
      付帯工事・オプション・設計料の追加が576万を超えた時点で、この土地は『適正より安い』ではなくなる。
      実測: 坪56.5万→総額7,480万(乖離−576万)/ 坪70万→7,879万(−177万)/ **坪76万→8,056万(±0)** /
      坪80万→8,174万(+118万)/ 坪90万→8,470万(+414万)/ 坪95万→8,618万(+562万)"
    check: "見積内訳(本体/付帯/諸経費の別)・標準仕様書・付帯工事の範囲(地盤改良/給排水引込/外構/空調/照明/カーテン/
      設計料/確認申請費)を書面で。**他社見積と相見積を取る**(建築条件なしなので比較できるのが最大の利点)。
      合計が2,246万(坪76万)を超えるかどうかが判断の分かれ目"
  - title: "参考プランが建つかどうかは、セットバック2.97m²が分水嶺 ── **2026-09-05 解消: 確認済証(第26UDI1S建01787号・令和8年9月3日)が延床97.70m²を承認**"
    effect: "解消(承認された延床・間取りは参考プランと同一)。以下は解消前の論点の記録"
    detail: "**2026-09-05に確認済証の写しで解消した**——延べ面積97.70m²・木造3階・一戸建ての住宅で建築基準関係規定への適合が証明され、
      新築分譲の販売図面の間取りも参考プランと同一(上の状況更新)。以下は登録時(2026-08-29)の論点で、記録として残す。
      前面道路は42条2項(現況約4m)。2項道路の後退は道路中心線から2mなので、現況幅員が4.0m未満なら
      その差の半分だけ敷地が減る。実効容積は前面4.0m×0.4=**160%**(指定200%は効かない)。
      延床97.70を建てるには敷地61.06m²が要り、**許容できるセットバックは64.03−61.06=2.97m²まで**
      (間口9.12mなら後退幅0.325mまで=現況幅員3.35mが下限)。
      図面には**セットバック面積の記載がない**うえ、参考プラン欄にも
      『建築確認未取得の為、行政各庁による詳細検討は未実施。行政指導の結果、居室から納戸への変更や
      天井高の変更・小屋裏の発生、また建築面積の変更などが生じる可能性がございます』と明記されている。
      **延床97.70m²は確定値ではない**"
    check: "解消済み。残るのは承認内容の把握として、申請図(配置図)でセットバック線と建築面積を見ること"
  - title: "土地単価300.0万/坪は岸町の較正値185万/坪の1.62倍"
    effect: "土地換算値(下値フロア)との差が大きく、下値の支えは薄い"
    detail: "5,810万÷19.36坪=**300.0万/坪**。岸町の基準坪単価は較正185万(土地成約4件)と公示ベース240万
      (岸町1丁目17-14の公示2026 208万/坪×1.15)の50:50ブレンドで213万/坪。
      公示の地点は**岸町1丁目=王子駅至近の台地側**で、本件(2丁目・標高6.5mの崖下)より条件が良い可能性がある。
      なお同じ岸町2丁目の新築戸建 nc_21485594(7,180万)から建物再調達を引いた土地の含みは274万/坪で、
      **建売より更地の方が坪単価が高い**という並びになっている"
    check: "岸町の土地成約が増えるまで解消しない。近隣の更地の売出事例を集めて突き合わせる"
  - title: "適正中央値8,056万の主成分は上十条・中十条の成約で、岸町の成約は1件も入っていない"
    effect: "岸町の較正値185万/坪だけを信じると 適正7,848万・乖離−368万・分水嶺 坪69.0万(余裕369万)へ縮む"
    detail: "リテール比較(重み65%)の事例23件の内訳は**中十条8件+上十条15件で、岸町0件**
      (築0〜1年の岸町成約が無いため)。engine/retail.js の normalizeLandUnit は時点・徒歩・幅員を
      標準化するが**地区の水準は標準化しない**ので、適正中央値は実質『十条の台地の新築相場』。
      本物件は崖下の低地(標高6.5m)で、この差をエンジンは測れない(成約データの住所が地区までしか
      公開されず、1件単位のハザード照合が原理的に不可能なため=崖の検証と同じ限界)。
      感度の実測: 基準坪単価を較正値185万のみにすると 適正中央値 8,056→**7,848万**・乖離 −576→**−368万**・
      建築費の分水嶺 坪76.0→**69.0万**(図面の56.5万からの余裕 576→**369万**)。
      つまり『適正より576万安い』は上振れ側の読みで、**369〜576万の幅**で見るのが正確"
    check: "建物見積の合計が『2,038万(坪69.0)〜2,246万(坪76.0)』のどこに着地するかで判断する"
  - title: "着工から完成まで最短半年・最長1年。この期間のコストはエンジンに入っていない ── **2026-09-05: 建売ルート(完成2027年3月予定)を選べば消える**"
    effect: "土地先行取得の保有コストが総額に乗る。ざっくり年60〜200万規模"
    detail: "エンジンは『取得した瞬間に家がある』前提なので、以下は査定値に一切反映されていない:
      ①**つなぎ融資の金利** — 土地5,810万を建物完成まで借りる。年2〜3%なら半年で58〜87万・1年で116〜174万
      ②**固定資産税の住宅用地特例が効かない** — 更地は課税標準1/6の特例が使えない。1月1日時点で判定するため、
        年をまたぐと1年分まるごと特例なしで課税される
      ③**二重の住居費** — 完成までの家賃が6〜12か月ぶん重なる
      ④**住宅ローン控除の入居年が2027年以降にずれる** — 区分・限度額は入居年の税制で決まる
      一方で建築条件なしなので**相見積で建築費を下げられる**という逆方向の効きもある"
    check: "つなぎ融資の金利と手数料、土地決済から建物引渡までの月数、更地期間の固定資産税額を金融機関と役所で"
  - title: "SUUMO掲載(nc_21089174・仲介オープンハウス)で判明した新事実3つ: 宅地造成工事規制区域・私道部分19.79m²・徒歩8分"
    effect: "①は台帳の掲載条件では自動登録スコープ外の区分 ②は含まれる/別枠で参考プランの成立が真っ二つに変わる"
    detail: "2026-08-29の土地カテゴリ初回クロールで本物件のSUUMO掲載が見つかり、クローラは
      **KO4(重大ハザードの明記)で自動ブロック**した。紙の販売図面に無かった情報が3つある:
      ①**その他制限事項『景観法による規制有、宅地造成工事規制区域、準防火地域』**。
      宅地造成工事規制区域は切土・盛土・擁壁に許可が要る区域で、それ自体が建築不可ではないが、
      台帳の掲載条件(2026-08-12決定)では自動登録のスコープ外に当たる。同じクロールで
      西側崖線沿いの土地が軒並み同種のKO(上十条4=宅造 / 上十条5=宅造・がけ条例 / 滝野川2=崖条例)
      になっており、**崖線近接の裏書き**と読める。造成・地盤改良費が参考プランの見積に
      入っているかの確認が必須。
      ②**私道負担・道路欄『私道部分19.79m2』**(図面のセットバック欄は空欄だった)。
      **19.79m²が土地64.03m²に含まれるなら実効44.24m²**で、参考プラン延床97.70は容積220%相当=建たない
      (1階33.74も建ぺい76%で不成立)。**別枠なら**前面私道の半幅帯(間口9.12m×2m≒18.2m²≈19.79)を
      所有する構図で、むしろ私道の権利関係が良い方に確定する。図面の区画図(多角形の外に道路)と
      建ぺい検算は別枠説と整合するが、**確定は公図・確定測量図でしかできない**。
      ③徒歩は東十条8分(図面7分・当YAMLの幾何検算8〜9分と整合。10分以下=補正0%で査定値は不変)。
      なお同じ穴として、**岸町2新築(アドキャスト図面)の側も宅地造成工事規制区域の該当有無は未確認**
      (SUUMOの制限欄は空欄だが、空欄は非該当の証拠にならない)"
    check: "①区域の該当範囲と規制内容を北区役所で ②公図・確定測量図で19.79m²の内外 ③造成費の見積計上の有無"
