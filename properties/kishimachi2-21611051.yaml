caveats:
  - title: "坪単価98万は岸町の基準185万/坪の53%で、安さの理由が掲載から読めない(2026-09-04に追加調査・未確定)"
    effect: "査定は「割安」と出るが、その差額の正体が未確認。**現地確認なしに候補として扱わない**"
    detail: "土地4,180万 ÷ 42.52坪 = **98.3万/坪**。岸町のエリア基準185万/坪に対し53%。
      面積が大きい帯の割引(北区の実測で土地130m2以上は −12.1%・95%CI −18.1〜−5.9)を差し引いても
      期待値は163万/坪で、実際の98万はその**60%**にとどまる。説明がついていない。
      候補: ①**岸町2は西100mで高低差16.7mの崖線**があり、傾斜地・擁壁を含む可能性
      ②古家の解体費・残置物 ③境界未確定・越境 ④再建築上の制約。
      **その他制限事項が「-」(記載なし)なのは『無い』ことの証明ではない**——
      台帳では西が丘2でSUUMOが空欄なのにathomeがレッドゾーンを明記していた前例がある。
      **2026-09-04の追加調査**: ①掲載HTMLに座標・ハザード語・備考は一切なし(特記事項は設備のみ)
      ②徒歩3駅からの位置絞り込みは失敗(解集合が崖の上下1km四方に広がる。上の site_scan)
      ③国交省の岸町土地成約(2005年以降19件)で坪120万未満は7件あり、**130m2以上の大区画は過去も安い**:
      2025Q4 260m2→500万(坪6万・幅員2.7m) / 2015 170m2→坪66万(幅員3m・私道) / 2020 180m2→坪96万(幅員2.7m・私道)。
      共通点は**前面道路2.7〜3m・私道**=接道の悪さだが、本件は『北西4m・私道負担無』なので同じ説明はそのままは効かない。
      残る候補は崖線の斜面・擁壁(同丁目に区域が近接)、境界未確定・越境、古家の解体・残置物、および
      『大区画は買い手が業者に限られ坪単価が下がる』という構造(北区実測で130m2以上は −12.1%、
      ただしそれだけでは6割の水準は説明できない)"
    check: "**番地の特定が先**(仲介への問い合わせ・公図)。番地が分かれば±40m走査で崖線・土砂区域を確定できる。
      現地で高低差・擁壁・境界杭。役所調査でがけ条例(東京都建築安全条例6条)・宅地造成工事規制区域の該当、
      前面道路の42条区分・公道私道の別。古家の構造・建坪・解体見積"
  - title: "前面4.0mのため実効容積は160%で、指定200%は効かない"
    effect: "建てられる延床が指定より2割小さい"
    detail: "法52条2項により実効容積 = 前面道路幅員 × 0.4(住居系)= 4.0×0.4 = **160%**。
      指定200%との差で、延床上限は 140.56×200%=281.1m2 ではなく **224.9m2** になる。
      戸建1棟なら十分だが、2棟に分けて建てる・賃貸併用にする等の使い方では効いてくる。
      台帳では岸町2 MIRASUMO(前面約4m・実効160%)・西ケ原4(前面3.3m・実効132%)が同じ論点"
    check: "役所調査で前面道路の幅員実測・42条区分・セットバックの要否"
  - title: "古家の解体費150万は想定値で、実額は構造と建坪で大きく動く"
    effect: "土地換算値が上下する"
    detail: "掲載は「古家有り」とだけ書き、**構造も建坪も築年も出していない**。
      木造2階建25坪 × 6万/坪 ≒150万で置いたが、鉄骨なら8万/坪、
      残置物・アスベスト・ブロック塀の撤去が乗るとさらに増える。
      一方で**古家があるうちは固定資産税の住宅用地特例(課税標準1/6)が効く**ため、
      更地で持つより保有コストは軽い(更地の滝野川1とはこの点が非対称)"
    check: "現地で古家の構造・階数・建坪。解体見積(3社)。アスベスト調査の要否"
  - title: "土地先行取得の費用がエンジンに入っていない"
    effect: "土地価格4,180万+解体の外に費用が乗る"
    detail: "①建築費(木造3階・準防火で坪80〜120万)②つなぎ融資の金利
      ③解体後は更地になり住宅用地特例が切れる(1月1日をまたぐと固定資産税が跳ねる)
      ④二重の住居費 ⑤住宅ローン控除の入居年がずれる。
      **建築条件なしなので相見積で建築費を下げられる**のは有利な側の非対称。
      土地が42.52坪と台帳最大なので、建物の設計自由度は台帳で最も高い"
    check: "解体の時期(1月1日をまたがない工程)、建築費の相見積、つなぎ融資の要否"
