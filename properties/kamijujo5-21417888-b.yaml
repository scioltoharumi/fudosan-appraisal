      A区画(接面6.1m・路地状部分なし・65.00m2)とは条件が大きく違い、**同じ2区画で400万差(5,480 vs 5,880)しかないのはBの制約が
      価格に十分反映されていない**とも読める。土地カテゴリの掲載条件『45m2以上』は『実効容積160%で延床72m2』の翻訳なので、
