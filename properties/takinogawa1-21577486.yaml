caveats:
  - title: "商業地域の土地を戸建用に買うと、払ったぶんを出口で回収しきれない"
    effect: "土地単価に商業プレミアムが乗るが、木造戸建として売るときには一部しか戻らない"
    detail: "北区の取引データで地区×5年帯を統制して測った実測(2026-09-02):
      **①土地の坪単価は商業地域が住居系より +85.6%**(95%CI +55.6〜+113.0・n=49)。
      **②戸建の総額/土地坪でみると商業地域は +96.8%** に見えるが、これは**延床/土地比の交絡**——
      商業地の戸建は延床/土地比の中央値が2.38(住居系1.29)で、木造は27%しかない(住居系82%)。
      **③延床/土地比を揃えると判別不能**(0.8〜1.4帯 +40.5%・CI −1.4〜+78.6 / 1.4〜2.2帯 −5.3%)。
      **④木造だけに絞ると +20.1%**(CI +5.0〜+45.5・n=30)。
      土地に+85.6%払って、木造戸建として売るときに戻るのは+20.1%。
      さらに**出口が薄い**——北区の戸建成約2,161件のうち商業地域は124件(5.7%)、
      木造に限った比較可能標本は30件しかない"
    check: "同じ滝野川1丁目・商業地域の土地成約を国交省APIで個別に抽出して水準を検算する"
  - title: "容積500%は戸建では21%しか使わない"
    effect: "使わない容積のぶんまで土地代を払う構図"
    detail: "土地76.3m2 × 容積500% = 延床上限381.5m2。戸建(延床80m2想定)ではその**21%**しか使わない。
      土地の値段は最有効使用(この立地なら店舗・事務所・共同住宅)で決まるため、
      戸建として使う限り余剰容積のぶんは死に金になる。
      実際、坪単価は284万/坪で滝野川のエリア基準247万/坪の**115%**。
      なお法52条2項により実効容積は前面道路の幅員にも縛られるが、**幅員が掲載に無い**"
    check: "役所調査で前面道路の幅員・42条区分。共同住宅・店舗併用など容積を使う用途の採算も併せて検討する"
  - title: "土地先行取得の費用がエンジンに一切入っていない"
    effect: "土地価格6,560万の外に費用が乗る"
    detail: "①建築費(木造3階・準防火で坪80〜120万。延床80m2=24.2坪なら1,936〜2,904万)
      ②つなぎ融資の金利(年2〜3%なら半年80〜120万・1年160〜240万)
      ③**更地は固定資産税の住宅用地特例(課税標準1/6)が効かない**(1月1日時点で判定)
      ④着工から完成までの二重の住居費 ⑤住宅ローン控除の入居年がずれる。
      **建築条件なしなので相見積で建築費を下げられる**のは有利な側の非対称"
    check: "建築費の相見積(3社)、つなぎ融資の要否と金利、着工〜引渡しのスケジュール"
  - title: "商業地域は周辺の用途混在と、隣地に高い建物が建つ可能性がある"
    effect: "住環境と日照・眺望のリスク"
    detail: "商業地域は用途制限が最も緩く、飲食店・遊技場・ホテル等が建てられる。
      また隣地も容積500%を使えるため、戸建の隣に中高層が建ちうる(日照・眺望・プライバシー)。
      本件は**都営三田線 西巣鴨9分 / JR京浜東北線 王子11分**で、駅前商業地ではないが
      現地の用途構成は掲載からは読めない"
    check: "現地で周辺の建物用途・階数・空地の状況、および用途地域図で隣接街区の指定を確認"
