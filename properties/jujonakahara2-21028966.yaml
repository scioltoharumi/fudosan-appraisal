    # ② 建物面積の食い違いは **「３階部分未登記」の明記で説明がついた**。
    #    3度目の掲載の「その他制限事項」に『３階部分未登記』とある。
    #    公簿(木造2階建89.07) < 登記表記130.74 < 現況142.1(車庫11.4込) の関係で、
