    #    掲載側の記載で裏付けられた。**YAMLの142.1は変更しない**(現況ベースの査定を維持)
    - "floor_m2: 掲載が『３階部分未登記』を明記。142.1(現況)と130.74(登記表記)の差は未登記部分で説明がつく"
