caveats:
  - title: "前面道路が幅員2.0m(台帳で最も狭い)。建替えは2項道路なら可だが、工事・融資・実効容積に効く"
    effect: "実効容積120%(指定240%の半分)。査定は4m未満(−5%)+セットバック控除で保守側だが、幅員2mの追加減価は係数に無い"
    detail: "接道義務(2m以上の接道)は接道幅5.5mで満たす。幅員2mの道は42条2項道路の指定があれば建替え可(セットバック要7.1m2はその前提)。ただし①工事車両が入らず資材の小運搬でコスト増 ②金融機関が担保評価を下げる・融資を渋ることがある ③実効容積は 2.0×0.6=120% で有効74.05m2×120%=88.9m2 が上限。事例側の実測では幅員〜2.0mの成約は基準(4〜6m)比 **−40.4%**(CI −61.2〜−19.1)で、エンジンの−5%より大きく安い帯"
    check: "役所で42条2項の指定の有無・中心線の位置・後退距離。金融機関の事前審査。工事の搬入計画"
  - title: "坪単価289万/坪(公簿)/317万/坪(有効)は上十条の基準225万の1.3〜1.4倍"
    effect: "土地値比較では売出が適正を上回る"
    detail: "6,480万÷24.55坪=264万…公簿81.15m2なら264万/坪、有効74.05m2(22.40坪)なら289万/坪。上十条の基準225万/坪は土地成約n=22の中央値(公示地点なし=外部検算なし)。十条駅5分は基準の母集団より駅近"
    check: "上十条1丁目・十条駅5分圏の土地成約を国交省APIで抽出(幅員2m台の成約に絞って比較)"
  - title: "近隣商業地域(80/240)は用途混在と隣地の中高層化の可能性"
    effect: "住環境・日照のリスク。土地単価には商業側のプレミアムが乗る"
    detail: "近隣商業は店舗・事務所の混在があり、隣地も容積240%を使える。上十条3(近隣商業80/300)の分析で近隣商業の容積率は戸建の価格に効かない(差0.2%・CI −7.7〜+10.1)ことを実測済み"
    check: "現地で周辺の建物用途・階数。用途地域図で隣接街区"
  - title: "土地先行取得の費用がエンジンに一切入っていない"
    effect: "土地価格6,480万の外に費用が乗る"
    detail: "①建築費(木造3階・準防火で坪80〜120万。延床80m2=24.2坪なら1,936〜2,904万)。**建築条件なしなので相見積で下げられる** ②つなぎ融資の金利(年2〜3%なら半年〜1年で土地価格の1〜3%) ③**更地は固定資産税の住宅用地特例(課税標準1/6)が効かない**(1月1日時点で判定) ④着工から完成までの二重の住居費 ⑤住宅ローン控除の入居年がずれる"
    check: "建築費の相見積(3社)、つなぎ融資の要否と金利、着工〜引渡しのスケジュール"
