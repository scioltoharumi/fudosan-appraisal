    check: "番地を特定して精密照合(±40m走査)。現地で高低差・擁壁の有無と状態。役所調査で土砂災害警戒区域の指定・
      がけ条例の適用・宅地造成工事規制区域の該当"

  - title: "エンジンは−1,519万の「割安」と出すが、その大半は時点修正で、生の坪単価は基準とほぼ同水準"
    effect: "割安の幅は読み方で 0〜1,500万 と動く"
    detail: "土地5,980万 ÷ 29.07坪 = **205.7万/坪**。岸町のエリア基準(成約較正185万と公示ベース240万の
      50:50ブレンド=213万/坪・2025年1月基準)に対し**97%**で、値付けとしては市場水準どおり。
      一方エンジンの適正中央値7,499万は、この213万を2026年9月まで**時点修正**(地価の年次レート)し、
      方位・複数駅等の個別補正+4.0%を掛けた**258万/坪**で立てている。売出はその80%にあたる。
      つまり−1,519万の「割安」は**時点修正でどれだけ地価が上がったとみるか**にほぼ依存する。
      同じ岸町2の古家付き kishimachi2-21611051(98万/坪・基準の53%)とは違い値付けは相場どおりだが、
      **位置の絞り込みで斜面帯・土砂災害警戒区域の縁に掛かると分かった**(上の caveat)ため、
      『相場どおりの値段で斜面地』の可能性を織り込んで読む"
    check: "同じ岸町2丁目・東十条5〜7分帯の2025〜26年の土地成約を国交省APIで抽出し、258万/坪の妥当性を検算する"
  - title: "前面4.0mのため実効容積は160%で、指定200%は効かない"
    effect: "建てられる延床が指定より2割小さい"
    detail: "法52条2項により実効容積 = 前面道路幅員 × 0.4(住居系)= 4.0×0.4 = **160%**。
      延床上限は 96.09×200%=192.2m2 ではなく **153.7m2**。二方路でも両方4.0mなので緩和されない。
      戸建1棟(延床80〜100m2)には十分。台帳では岸町2 MIRASUMO・kishimachi2-21611051・西ケ原4が同じ論点"
    check: "役所調査で前面道路2本の幅員実測・42条区分・セットバックの要否"
  - title: "土地先行取得の費用がエンジンに一切入っていない"
    effect: "土地価格5,980万の外に費用が乗る"
    detail: "①建築費(木造3階・準防火で坪80〜120万。延床85m2=25.7坪なら2,056〜3,084万)
      ②つなぎ融資の金利(年2〜3%なら半年70〜110万・1年140〜220万)
      ③**更地は固定資産税の住宅用地特例(課税標準1/6)が効かない**(1月1日時点で判定)
      ④着工から完成までの二重の住居費 ⑤住宅ローン控除の入居年がずれる。
      **建築条件なしなので相見積で建築費を下げられる**のは有利な側の非対称。
      土地+建築の総額は 8,036〜9,064万 となり、台帳の建売の売出中央値7,530万を上回りうる"
    check: "建築費の相見積(3社)、つなぎ融資の要否と金利、着工〜引渡しのスケジュール"
