      50:50ブレンド=213万/坪・2025年1月基準)に対し**97%**で、値付けとしては市場水準どおり。
      一方エンジンの適正中央値7,499万は、この213万を2026年9月まで**時点修正**(地価の年次レート)し、
      方位・複数駅等の個別補正+4.0%を掛けた**258万/坪**で立てている。売出はその80%にあたる。
      つまり−1,519万の「割安」は**時点修正でどれだけ地価が上がったとみるか**にほぼ依存する。
      同じ岸町2の古家付き kishimachi2-21611051(98万/坪・基準の53%)とは違い、こちらは
      **二方路・東十条5分**で条件が良く、安さの理由を疑う必要はない。読み方は
      『生の水準では相場どおり、時点修正を信じるなら1,500万安い』の幅で持つ"
    check: "同じ岸町2丁目・東十条5〜7分帯の2025〜26年の土地成約を国交省APIで抽出し、258万/坪の妥当性を検算する"
  - title: "前面4.0mのため実効容積は160%で、指定200%は効かない"
    effect: "建てられる延床が指定より2割小さい"
    detail: "法52条2項により実効容積 = 前面道路幅員 × 0.4(住居系)= 4.0×0.4 = **160%**。
      延床上限は 96.09×200%=192.2m2 ではなく **153.7m2**。二方路でも両方4.0mなので緩和されない。
